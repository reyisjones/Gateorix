[package]
name = "gateorix-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Gateorix Rust backend adapter for stdio and development HTTP"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"